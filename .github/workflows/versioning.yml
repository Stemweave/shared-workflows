name: versioning

# This repository versions itself with its own workflows. Callers use main, so the releases are a
# record and a way to pin or roll back, not something callers have to follow.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

jobs:
  pr-description:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/semantic-version-pr-check.yml

  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/semantic-version-release.yml
