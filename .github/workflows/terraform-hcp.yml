name: Terraform on HCP Terraform

# Runs terraform plan, apply, or destroy for a repository whose state is in HCP Terraform, using an
# API-driven workspace. The caller decides the action: plan for a pull request, apply for a merge,
# and whatever was picked for a manual run. See the README for the caller.
on:
  workflow_call:
    inputs:
      action:
        description: plan, apply, or destroy.
        type: string
        required: true
      confirm:
        description: To destroy, the repository name, typed to confirm.
        type: string
        default: ""
      working_directory:
        description: The folder holding the Terraform configuration.
        type: string
        default: .
      terraform_version:
        description: The Terraform CLI to install on the runner. The workspace sets the version remote runs use.
        type: string
        default: 1.x
      runs_on:
        description: Runner label.
        type: string
        default: ubuntu-latest
    secrets:
      TF_API_TOKEN:
        description: An HCP Terraform team token. It runs plans, and applies too when TF_API_TOKEN_APPLY is not set.
        required: true
      TF_API_TOKEN_APPLY:
        description: Optional second token with permission to apply. When set, only apply and destroy use it, so plans can run with a token that can't change anything.
        required: false

permissions: {}

jobs:
  terraform:
    name: terraform
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60
    # A new push replaces a running plan. Applies never replace each other: they wait their turn.
    # A waiting apply that is replaced by a newer one is fine, because every apply uses the latest code.
    concurrency:
      group: ${{ inputs.action == 'plan' && format('terraform-plan-{0}-{1}', github.repository, github.ref) || format('terraform-apply-{0}', github.repository) }}
      cancel-in-progress: ${{ inputs.action == 'plan' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check the request
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          case "$ACTION" in
            plan | apply | destroy) ;;
            *)
              echo "::error::The action must be plan, apply, or destroy, not '$ACTION'."
              exit 1
              ;;
          esac
          if [ "$ACTION" != "plan" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::$ACTION only runs from $DEFAULT_BRANCH, so unreviewed code is never applied. This run is on '$REF_NAME'."
            exit 1
          fi
          if [ "$ACTION" = "destroy" ] && [ "$CONFIRM" != "$REPO_NAME" ]; then
            echo "::error::To destroy, type the repository name ($REPO_NAME) in the confirm box."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ (inputs.action != 'plan' && secrets.TF_API_TOKEN_APPLY) || secrets.TF_API_TOKEN }}

      - name: Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -no-color

      - name: Check what the token may do
        working-directory: ${{ inputs.working_directory }}
        env:
          ACTION: ${{ inputs.action }}
          TOKEN: ${{ (inputs.action != 'plan' && secrets.TF_API_TOKEN_APPLY) || secrets.TF_API_TOKEN }}
          BODY: ${{ runner.temp }}/workspace.json
        run: |
          # Asks HCP Terraform what this token is allowed to do on the workspace, and prints it. This
          # only informs: it never fails the run, so a wrong guess here can't block a good token.
          info=$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1]))["backend"]["config"]; print(c.get("hostname") or "app.terraform.io", c["organization"], (c.get("workspaces") or {}).get("name") or "")' .terraform/terraform.tfstate 2>/dev/null) || exit 0
          read -r host org workspace <<< "$info"
          [ -n "$workspace" ] || exit 0

          status=$(curl -sS -o "$BODY" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://$host/api/v2/organizations/$org/workspaces/$workspace") || {
            echo "::notice::Could not ask HCP Terraform what the token may do."
            exit 0
          }
          if [ "$status" != "200" ]; then
            echo "::warning title=HCP Terraform did not accept the token::Asking about workspace $org/$workspace answered HTTP $status. A 401 means the token is invalid. A 404 means it can't see that workspace, or the organization or workspace name is wrong."
            exit 0
          fi

          report=$(python3 - "$BODY" "$ACTION" <<'PY'
          import json, sys
          path, action = sys.argv[1:3]
          perms = json.load(open(path))["data"]["attributes"].get("permissions", {})
          needs = {
              "plan": ["can-queue-run"],
              "apply": ["can-queue-run", "can-queue-apply", "can-lock"],
              "destroy": ["can-queue-run", "can-queue-apply", "can-lock", "can-queue-destroy"],
          }[action]
          for key in ("can-queue-run", "can-queue-apply", "can-queue-destroy", "can-lock", "can-update"):
              if key in perms:
                  print(f"  {key}: {perms[key]}")
          lacking = [key for key in needs if perms.get(key) is False]
          if lacking:
              print("LACKING " + ", ".join(lacking))
          PY
          ) || exit 0

          echo "What the token may do on $org/$workspace:"
          echo "$report" | grep -v '^LACKING'
          if echo "$report" | grep -q '^LACKING'; then
            lacking=$(echo "$report" | sed -n 's/^LACKING //p')
            echo "::warning title=The token may not be allowed to $ACTION::On $org/$workspace this token lacks: $lacking. If it is an organization token, replace it: those can't run plans. Otherwise give the token's team Plan access (Write for apply) on this workspace or its project."
          fi

      - name: Check formatting
        if: inputs.action == 'plan'
        working-directory: ${{ inputs.working_directory }}
        run: terraform fmt -check -recursive -diff -no-color

      - name: Validate
        if: inputs.action == 'plan'
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate -no-color

      - name: Run terraform ${{ inputs.action }}
        id: terraform
        working-directory: ${{ inputs.working_directory }}
        env:
          ACTION: ${{ inputs.action }}
          LOG: ${{ runner.temp }}/terraform.log
        run: |
          set -o pipefail

          run_terraform() {
            case "$ACTION" in
              plan) terraform plan -no-color ;;
              apply) terraform apply -no-color -auto-approve ;;
              destroy) terraform destroy -no-color -auto-approve ;;
            esac
          }

          for attempt in 1 2 3; do
            if run_terraform 2>&1 | tee "$LOG"; then
              exit 0
            fi
            # Two jobs that upload identical files at once collide while HCP Terraform creates the run.
            # Nothing has been planned or applied at that point, so trying again is safe. Any other
            # failure is final.
            if [ "$attempt" -lt 3 ] && grep -q "Failed to create run: conflict" "$LOG"; then
              wait=$((attempt * 15))
              echo "::notice::HCP Terraform reported a conflict while creating the run. Trying again in ${wait}s (attempt $((attempt + 1)) of 3)."
              sleep "$wait"
              continue
            fi
            exit 1
          done

      - name: Explain a token problem
        if: ${{ !cancelled() && steps.terraform.outcome == 'failure' }}
        env:
          ACTION: ${{ inputs.action }}
          HAS_APPLY_TOKEN: ${{ secrets.TF_API_TOKEN_APPLY != '' }}
          LOG: ${{ runner.temp }}/terraform.log
        run: |
          # HCP Terraform refuses a token that can read a workspace but not use it, and says so in two
          # different ways. Turn both into something that names the fix.
          title=""
          if grep -q "Insufficient rights to generate a plan" "$LOG" 2>/dev/null; then
            title="The token can't run plans"
            msg="The token can read this workspace but isn't allowed to plan on it. Give its team at least Plan access to the workspace, or to the project that holds it. Read access is not enough."
            if [ "$ACTION" != "plan" ] && [ "$HAS_APPLY_TOKEN" != "true" ]; then
              msg="TF_API_TOKEN_APPLY is not set for this repository, so TF_API_TOKEN was used. $msg"
            fi
          elif grep -q "Error acquiring the state lock" "$LOG" 2>/dev/null && grep -q "resource not found" "$LOG" 2>/dev/null; then
            title="The token can't lock the workspace"
            if [ "$ACTION" != "plan" ] && [ "$HAS_APPLY_TOKEN" != "true" ]; then
              msg="TF_API_TOKEN_APPLY is not set for this repository, so TF_API_TOKEN was used, and a plan-level token can't lock the workspace. Add TF_API_TOKEN_APPLY as an organization secret shared with this repository, or give TF_API_TOKEN write access."
            elif [ "$ACTION" != "plan" ]; then
              msg="The apply token can't lock this workspace. Give its team Write access to the workspace, or to the project that holds it. An organization token won't work here: use a team or user token."
            else
              msg="The plan token can't lock this workspace. Check that its team has access to the workspace, or to the project that holds it."
            fi
          fi
          [ -n "$title" ] || exit 0

          echo "::error title=$title::$msg"
          echo "### $title" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: ${{ !cancelled() && steps.terraform.outcome != 'skipped' }}
        env:
          ACTION: ${{ inputs.action }}
          OUTCOME: ${{ steps.terraform.outcome }}
          LOG: ${{ runner.temp }}/terraform.log
        run: |
          {
            echo "## Terraform $ACTION: $OUTCOME"
            echo
            if [ -f "$LOG" ]; then
              echo '```'
              head -c 60000 "$LOG"
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.action == 'plan' && steps.terraform.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.terraform.outcome }}
          DIRECTORY: ${{ inputs.working_directory }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: ${{ runner.temp }}/terraform.log
        run: |
          marker="<!-- terraform-plan:${DIRECTORY} -->"

          if [ "$OUTCOME" != "success" ]; then
            headline="The plan failed."
          elif grep -q "^No changes\." "$LOG" 2>/dev/null; then
            headline="No changes. The configuration matches what exists."
          else
            headline=$(grep -E '^Plan: ' "$LOG" | tail -n 1 || true)
            headline="${headline:-The plan succeeded.}"
          fi

          {
            echo "$marker"
            echo "### Terraform plan"
            echo
            echo "**$headline** [Run log]($RUN_URL)"
            echo
            echo "<details><summary>Show the plan</summary>"
            echo
            echo '```'
            head -c 60000 "$LOG" 2>/dev/null || true
            echo
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"

          # Pull requests from forks get a read-only token, so a comment can fail. It never fails the job.
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" 2>/dev/null | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null \
              || echo "::warning::Could not update the plan comment."
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null \
              || echo "::warning::Could not post the plan comment."
          fi
